<!DOCTYPE html>
<html>
<head>
    <title>3D</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: #1a1a1a;
        }
        canvas { display: block; }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            max-height: 90vh;
            overflow-y: auto;
            width: 320px;
            color: #ffffff;
        }
        .title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffffff;
        }
        #fileInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px dashed #444;
            border-radius: 8px;
            cursor: pointer;
            background: #2a2a2a;
            color: #ffffff;
        }
        #fileInput:hover {
            border-color: #666;
        }
        .control-group {
            margin: 15px 0;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        #playButton {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        #playButton:hover {
            background: #45a049;
        }
        .slider {
            width: 100%;
            margin: 10px 0;
            background: #444;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 5px;
            background: #2a2a2a;
            border-radius: 5px;
            color: #ffffff;
        }
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        #frameInfo {
            text-align: center;
            color: #ccc;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="controls">
        <div class="title">3D 人體姿態視覺化</div>
        <input type="file" id="fileInput" accept=".json">
        <div class="control-group">
            <button id="playButton">播放</button>
            <div id="frameInfo">幀數: 0</div>
            <input type="range" id="slider" class="slider" value="0">
            <div>
                播放速度: <span id="speedValue">1x</span>
                <input type="range" id="speedControl" class="slider" min="0.1" max="2" step="0.1" value="1">
            </div>
        </div>
        <div id="jointControls" class="checkbox-grid">
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const joints = {
            'tennis_ball': { color: '#FF6B6B', size: 0.05, emission: true },
            'nose': { color: '#4ECDC4', size: 0.015, emission: true },
            'left_eye': { color: '#45B7D1', size: 0.012, emission: true },
            'right_eye': { color: '#45B7D1', size: 0.012, emission: true },
            'left_ear': { color: '#96CEB4', size: 0.012 },
            'right_ear': { color: '#96CEB4', size: 0.012 },
            'left_shoulder': { color: '#FF8C42', size: 0.02 },
            'right_shoulder': { color: '#FF8C42', size: 0.02 },
            'left_elbow': { color: '#FF8C42', size: 0.018 },
            'right_elbow': { color: '#FF8C42', size: 0.018 },
            'left_wrist': { color: '#FF8C42', size: 0.015 },
            'right_wrist': { color: '#FF8C42', size: 0.015 },
            'left_hip': { color: '#6C5B7B', size: 0.02 },
            'right_hip': { color: '#6C5B7B', size: 0.02 },
            'left_knee': { color: '#6C5B7B', size: 0.018 },
            'right_knee': { color: '#6C5B7B', size: 0.018 },
            'left_ankle': { color: '#6C5B7B', size: 0.015 },
            'right_ankle': { color: '#6C5B7B', size: 0.015 }
        };

        const skeleton_connections = [
            ['nose', 'left_eye'], ['nose', 'right_eye'],
            ['left_eye', 'left_ear'], ['right_eye', 'right_ear'],
            ['left_ear', 'left_shoulder'], ['right_ear', 'right_shoulder'],
            ['left_shoulder', 'right_shoulder'],
            ['left_shoulder', 'left_hip'], ['right_shoulder', 'right_hip'],
            ['left_hip', 'right_hip'],
            ['left_shoulder', 'left_elbow'], ['left_elbow', 'left_wrist'],
            ['right_shoulder', 'right_elbow'], ['right_elbow', 'right_wrist'],
            ['left_hip', 'left_knee'], ['left_knee', 'left_ankle'],
            ['right_hip', 'right_knee'], ['right_knee', 'right_ankle']
        ];

        let scene, camera, renderer, controls;
        let joints3D = {};
        let lines = [];
        let trajectoryData = [];
        let currentFrame = 0;
        let isPlaying = false;
        let playbackSpeed = 1;
        let frameInterval = null;
        const SCALE_FACTOR = 0.001;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.2, 2.5);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0.8, 0);
            
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const gridHelper = new THREE.GridHelper(10, 20, 0x444444, 0x333333);
            scene.add(gridHelper);

            const planeGeometry = new THREE.PlaneGeometry(10, 10);
            const planeMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                metalness: 0.5,
                roughness: 0.5,
                transparent: true,
                opacity: 0.5
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            scene.add(plane);
            
            Object.entries(joints).forEach(([name, props]) => {
                const geometry = new THREE.SphereGeometry(props.size, 32, 32);
                const material = new THREE.MeshPhongMaterial({
                    color: props.color,
                    shininess: 100,
                    emissive: props.emission ? props.color : 0x000000,
                    emissiveIntensity: props.emission ? 0.5 : 0
                });
                
                const sphere = new THREE.Mesh(geometry, material);
                sphere.castShadow = true;
                sphere.receiveShadow = true;
                joints3D[name] = sphere;
                scene.add(sphere);
            });
            
            skeleton_connections.forEach(() => {
                const lineMaterial = new THREE.LineBasicMaterial({
                    color: 0x00ff99,
                    linewidth: 2,
                    transparent: true,
                    opacity: 0.6
                });
                const line = new THREE.Line(new THREE.BufferGeometry(), lineMaterial);
                lines.push(line);
                scene.add(line);
            });
            
            createControls();
            setupEventListeners();
            animate();
        }

        function createControls() {
            const container = document.getElementById('jointControls');
            container.innerHTML = '';
            
            Object.entries(joints).forEach(([name, props]) => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `show_${name}`;
                checkbox.checked = true;
                
                const label = document.createElement('label');
                
                const colorDot = document.createElement('span');
                colorDot.className = 'color-dot';
                colorDot.style.backgroundColor = props.color;
                
                label.appendChild(colorDot);
                label.appendChild(document.createTextNode(name));
                
                div.appendChild(checkbox);
                div.appendChild(label);
                container.appendChild(div);
                
                checkbox.addEventListener('change', () => updateVisibility());
            });
        }

        function updateVisibility() {
            Object.entries(joints3D).forEach(([name, mesh]) => {
                mesh.visible = document.getElementById(`show_${name}`).checked;
            });

            skeleton_connections.forEach((connection, index) => {
                const [start, end] = connection;
                const startVisible = document.getElementById(`show_${start}`).checked;
                const endVisible = document.getElementById(`show_${end}`).checked;
                lines[index].visible = startVisible && endVisible;
            });
        }

        function setupEventListeners() {
            const slider = document.getElementById('slider');
            const playButton = document.getElementById('playButton');
            const speedControl = document.getElementById('speedControl');
            
            slider.addEventListener('input', (e) => {
                currentFrame = parseInt(e.target.value);
                document.getElementById('frameInfo').textContent = `幀數: ${currentFrame}`;
                updatePose(currentFrame);
            });
            
            playButton.addEventListener('click', togglePlayback);
            
            speedControl.addEventListener('input', (e) => {
                playbackSpeed = parseFloat(e.target.value);
                document.getElementById('speedValue').textContent = `${playbackSpeed.toFixed(1)}x`;
                if (isPlaying) restartPlayback();
            });

            document.getElementById('fileInput').addEventListener('change', handleFileUpload);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function togglePlayback() {
            isPlaying = !isPlaying;
            const playButton = document.getElementById('playButton');
            playButton.textContent = isPlaying ? '暫停' : '播放';
            playButton.style.background = isPlaying ? '#f44336' : '#4CAF50';
            
            if (isPlaying) {
                startPlayback();
            } else {
                clearInterval(frameInterval);
            }
        }

        function startPlayback() {
            const frameTime = 1000 / (30 * playbackSpeed);
            frameInterval = setInterval(() => {
                if (currentFrame >= trajectoryData.length - 1) {
                    currentFrame = 0;
                } else {
                    currentFrame++;
                }
                updateFrame();
            }, frameTime);
        }

        function restartPlayback() {
            if (isPlaying) {
                clearInterval(frameInterval);
                startPlayback();
            }
        }

        function updateFrame() {
            const slider = document.getElementById('slider');
            slider.value = currentFrame;
            document.getElementById('frameInfo').textContent = `幀數: ${currentFrame}`;
            updatePose(currentFrame);
        }

        function updatePose(frameIndex) {
    if (!trajectoryData[frameIndex]) return;
    const frame = trajectoryData[frameIndex];

    // 計算當前幀的所有關節點的中心點
    let centerX = 0;
    let centerZ = 0;
    let pointCount = 0;
    
    // 找到最低的 y 座標（腳的位置）和計算 x,z 的中心
    let minY = Infinity;
    Object.entries(frame).forEach(([name, pos]) => {
        if (pos && typeof pos.x === 'number' && typeof pos.z === 'number') {
            centerX += pos.x;
            centerZ += pos.z;
            pointCount++;
            
            if (pos.y !== undefined && (name === 'left_ankle' || name === 'right_ankle')) {
                minY = Math.min(minY, pos.y);
            }
        }
    });

    // 計算中心點偏移
    centerX = centerX / pointCount;
    centerZ = centerZ / pointCount;

    // 更新所有關節點的位置，將模型置中
    Object.entries(joints3D).forEach(([name, mesh]) => {
        if (frame[name]) {
            mesh.position.set(
                (frame[name].x - centerX) * SCALE_FACTOR,
                (frame[name].y - minY) * SCALE_FACTOR,
                -(frame[name].z - centerZ) * SCALE_FACTOR
            );
        }
    });

    // 更新骨架線
    skeleton_connections.forEach((connection, index) => {
        const [start, end] = connection;
        if (frame[start] && frame[end]) {
            const points = [
                new THREE.Vector3(
                    (frame[start].x - centerX) * SCALE_FACTOR,
                    (frame[start].y - minY) * SCALE_FACTOR,
                    -(frame[start].z - centerZ) * SCALE_FACTOR
                ),
                new THREE.Vector3(
                    (frame[end].x - centerX) * SCALE_FACTOR,
                    (frame[end].y - minY) * SCALE_FACTOR,
                    -(frame[end].z - centerZ) * SCALE_FACTOR
                )
            ];
            lines[index].geometry.setFromPoints(points);
        }
    });
}

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    let content = e.target.result
                        .replace(/^\uFEFF/, '')
                        .replace(/^['"]|['"]$/g, '')
                        .trim();
                    
                    let data = JSON.parse(content);
                    trajectoryData = Array.isArray(data) ? data : [data];
                    
                    const isValidData = trajectoryData.every(frame => {
                        return frame.hasOwnProperty('frame') && 
                               Object.keys(joints).every(key => 
                                   !frame[key] || (
                                       frame[key].x !== undefined && 
                                       frame[key].y !== undefined && 
                                       frame[key].z !== undefined
                                   )
                               );
                    });
                    
                    if (!isValidData) {
                        throw new Error('無效的數據格式：每個幀都必須包含關節點座標');
                    }
                    
                    const slider = document.getElementById('slider');
                    slider.max = trajectoryData.length - 1;
                    slider.value = 0;
                    document.getElementById('frameInfo').textContent = '幀數: 0';
                    
                    currentFrame = 0;
                    updatePose(0);
                    
                    console.log('數據載入成功:', trajectoryData.length, '幀');
                } catch (error) {
                    console.error('錯誤詳情:', error);
                    alert('解析 JSON 文件時出錯。請確保文件格式正確。\n錯誤: ' + error.message);
                }
            };
            
            reader.onerror = (error) => {
                console.error('檔案讀取錯誤:', error);
                alert('讀取檔案時出錯。請重試。');
            };
            
            reader.readAsText(file);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // 添加輕微的浮動效果
            Object.values(joints3D).forEach(joint => {
                joint.position.y += Math.sin(Date.now() * 0.002) * 0.0001;
            });
            
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
