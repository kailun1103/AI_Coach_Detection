<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and Trajectory Comparison</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="left-panel">
        <div class="videoplayer">
            <h2>🎥 Video Player 🎥</h2>
            <select id="videoSelect" class="file-input">
                <option value="">Choose a File</option>
            </select>

            <video id="videoPlayer" controls loop></video>
            <div class="speed-control">
                <label for="speedControl">Playback Speed:</label>
                <input type="range" id="speedControl" min="0.25" max="2" step="0.25" value="1">
                <span id="speedValue">1x</span>
            </div>
        </div>
        <div class="feedback">
            <h2>🤖 AI Coach Feedback 🎾</h2>
            <div class="speed-control">
                <label><strong>🤖 COACH FRANK：</strong></label>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="trajectory-controls">
            <h2>📈 Trajectory Files 📈</h2>
            <select id="jsonFileSelectSide" onchange="handleFileSelection(this.value)">
                <option value="">Choose Side file</option>
            </select>
        </div>
        <div class="chart-box">
            <div class="filename" id="filename1" style="color: rgb(108, 0, 158);">📂 Wait for File...</div>
            <canvas id="trajectoryChart1"></canvas>
        </div>

        <div class="trajectory-controls">
            <select id="jsonFileSelect45" onchange="handleFileSelection(this.value)">
                <option value="">Choose 45 degree file</option>
            </select>
        </div>
        <div class="chart-box">
            <div class="filename" id="filename2" style="color: rgb(108, 0, 158);">📂 Wait for File...</div>
            <canvas id="trajectoryChart2"></canvas>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
